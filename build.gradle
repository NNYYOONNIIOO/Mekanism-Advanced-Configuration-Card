buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.5.1'
group = 'com.Nyonio.mekanism_advanced_configuration_card'
archivesBaseName = 'mekanism_advanced_configuration_card-1.12.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { url = 'https://maven.cil.li/' }
    maven { url = 'https://cursemaven.com/' }
    maven { url = 'https://repo.spongepowered.org/maven/' }
    maven { url = 'https://modmaven.k-4u.nl/' }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    
    implementation fg.deobf("curse.maven:mekanism-ce-unofficial-840735:8411935")
    implementation fg.deobf("curse.maven:mekanismceu-moremachine-1606952:8430406")
    compileOnly 'curse.maven:baubles-227083:2518667'
    compileOnly 'curse.maven:ae2-uel-570458:4623763'
    compileOnly 'curse.maven:jei-238222:5101333'
    compileOnly 'curse.maven:inventory-tweaks-223094:2482481'
    compileOnly 'curse.maven:redstone-flux-270789:2920436'
    compileOnly 'curse.maven:industrial-craft-242638:3838713'
    compileOnly 'curse.maven:inventory-bogosorter-632327:7650535'
    compileOnly fg.deobf("curse.maven:mekanismceu-ae-upgrade-1606943:8416019")
}

jar {
    manifest {
        attributes([
            "Specification-Title": "mekanism_advanced_configuration_card",
            "Specification-Vendor": "Nyonio",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"Nyonio",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
